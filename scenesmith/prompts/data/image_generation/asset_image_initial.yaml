name: "asset_image_initial"
version: "1.0"
description: "Initial image generation for 3D asset conversion"
template_variables: ["description", "style_prompt"]
prompt: |
  Generate a clean product photography image of: {{ description }}.
  Style: {{ style_prompt }}.
  Show the complete object centered in the image, fully visible and not cropped.
  Place it against a perfectly uniform pure white background.
  The object should appear visually isolated against the white background, with clear boundaries and even neutral lighting.

